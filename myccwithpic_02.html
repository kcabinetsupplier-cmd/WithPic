<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双零轮盘实时分析器 含图片识别</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#e8edf7;background:#101626}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1080px;margin:auto}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted,.empty{color:#a6b2c8}.panel{background:#1b2437;border:1px solid #34415b;border-radius:14px;padding:20px;margin:18px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,textarea{font:inherit;font-size:18px;padding:10px;background:#0d1526;color:#fff;border:2px solid #6e88af;border-radius:8px}#entry{font-size:24px;width:130px}button{padding:12px 16px;font-size:15px;border:0;border-radius:8px;cursor:pointer;background:#2f66cd;color:#fff}button.secondary{background:#3c4b66}button.danger{background:#a23946}button:disabled{opacity:.55;cursor:not-allowed}.results{font-size:19px;line-height:2;overflow-wrap:anywhere}.results .line{white-space:nowrap;overflow-x:auto}.chip{display:inline-block;background:#314765;border-radius:7px;margin:3px;padding:5px 9px}.notice{color:#ffcf70}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid .panel{margin:0}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #35415a;text-align:left}.money{font-weight:bold;color:#8eefa9}#status{min-height:24px;color:#ffca84}#preview,#camera{max-width:100%;max-height:320px;border-radius:9px;background:#0d1526;display:none}#ocrText{width:100%;min-height:72px;margin-top:10px}.scanbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,1fr);gap:18px}.scanbox aside{min-width:0}.small{font-size:13px}@media(max-width:740px){.grid,.scanbox{grid-template-columns:1fr}body{padding:14px}}dialog{border:1px solid #7891ba;border-radius:14px;background:#202b40;color:#fff;padding:26px;min-width:300px;box-shadow:0 20px 70px #0009}dialog::backdrop{background:#000a}dialog p{font-size:20px;margin:0 0 20px}dialog .row{justify-content:flex-end}
</style></head><body><main><h1>双零轮盘实时分析器</h1><div class="muted">PC 版 含图片识别 · 37 代表双零（00）· 最多录入 40 局</div>
<section class="panel"><h2>录入结果</h2><div class="row"><input id="entry" type="text" inputmode="numeric" autocomplete="off" aria-label="输入0到37" placeholder="0–37"><button id="add">确认输入 ↵</button><button id="undo" class="secondary">撤销上一局</button><button id="reset" class="danger">清零 / 新游戏</button></div><p class="muted">输入整数后按 Enter；支持撤销。数据自动保存在本机浏览器。</p><div id="status" role="status"></div></section>
<section class="panel"><h2>拍照或图片识别</h2><div class="scanbox"><div><div class="row"><label><button type="button" id="choose">选择图片文件</button><input id="file" type="file" accept="image/*" hidden></label><button id="openCamera" class="secondary" type="button">打开摄像头</button><button id="takePhoto" class="secondary" type="button" disabled>拍照</button><button id="scan" type="button" disabled>识别数字</button></div><p class="muted small">选择照片后点击“识别数字”。识别完成后，可直接编辑号码再导入。</p><video id="camera" autoplay playsinline></video><img id="preview" alt="待识别图片预览"></div><aside><strong>识别结果（已按右到左排序）</strong><textarea id="ocrText" aria-label="识别结果"></textarea><div class="row" style="margin-top:10px"><button id="importOcr" type="button" disabled>作为初始数据导入</button><button id="clearOcr" class="secondary" type="button">清除图片</button></div><p id="ocrStatus" class="muted small">可识别 0–36、37 和 00；00 会保存为 37。</p></aside></div></section>
<section class="panel"><h2>游戏结果</h2><div id="results" class="results empty">尚无结果</div></section><div class="grid"><section class="panel"><h2>统计</h2><div id="stats"></div></section><section class="panel"><h2>尾号提醒</h2><div id="tails"></div></section><section class="panel"><h2>数列与倍数</h2><div id="patterns"></div></section></div><section class="panel"><h2>三粘连提醒</h2><div id="triples"></div></section><section class="panel"><h2>下注建议</h2><div id="bets"></div></section><section class="panel"><h2>不重复数字 NRNo</h2><strong id="nr"></strong></section><p class="muted">下注提示仅执行文件中可明确计算的规则；轮盘结果独立随机，历史记录不能预测下一局。每局建议总额上限 $20。</p></main>
<dialog id="resetDialog"><p>确定清空当前游戏数据吗？</p><div class="row"><button id="resetYes" class="danger">确定</button><button id="resetNo" class="secondary">取消</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id),WHEEL=[0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,37,27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2],SERIES=[[1,3,5,7,9],[2,4,6,8,10],[11,13,15,17],[12,14,16,18],[21,23,25,27],[20,22,24,26,28],[30,32,34,36]],TRIPLES=[[2,14,35],[2,20,22]],INITIAL_DATA=[18,8,4,18,24,33,3,22,18,17,8,13,18,2,5,2,32,19];let data=[...INITIAL_DATA],imageUrl='',stream=null;try{let s=JSON.parse(localStorage.getItem('roulette_pc_pic_v1'));if(Array.isArray(s))data=s.filter(x=>Number.isInteger(x)&&x>=0&&x<=37).slice(0,40)}catch{}const fmt=n=>n===37?'00':String(n),html=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');
function tailGroup(t){return t===0?[0,10,20,30,37]:Array.from({length:t<=6?4:3},(_,i)=>t+10*i)}function adjacent(n){let i=WHEEL.indexOf(n);return[WHEEL[(i+36)%38],WHEEL[(i+37)%38],WHEEL[(i+1)%38],WHEEL[(i+2)%38]]}function related(c,r){return r.some(n=>n!==c&&n>0&&c>0&&(n%c===0||c%n===0))}
function analyze(a){let counts=new Map();a.forEach(n=>counts.set(n,(counts.get(n)||0)+1));let hot=[...counts].filter(([,c])=>c>=2).sort((x,y)=>y[1]-x[1]||x[0]-y[0]),tails=Array.from({length:10},(_,i)=>i===9?0:i+1).map(t=>({t,group:tailGroup(t),missing:tailGroup(t).filter(n=>!counts.has(n))})),last=a.at(-1),prev=a.slice(-16,-1),recent=a.slice(-5);return{counts,nr:counts.size,hot,tails,series:last===undefined?[]:SERIES.filter(s=>s.includes(last)&&s.some(n=>n!==last&&prev.includes(n))),multiples:last===undefined?[]:a.slice(-6,-1).filter(n=>last>0&&n>0&&n!==last&&(n%last===0||last%n===0)).map(n=>last<n?`${fmt(last)} 是 ${fmt(n)} 的 1/${n/last}`:`${fmt(last)} 是 ${fmt(n)} 的 ${last/n} 倍`),triples:TRIPLES.map(t=>({t,missing:t.filter(n=>!a.slice(-15).includes(n))})).filter(x=>x.missing.length===1),recent}}
function allocate(a){if(a.nr<19)return{rows:[],reason:'NRNo 达到 19 后显示下注建议。'};let e=a.tails.filter(x=>x.t<=6&&x.missing.length===4);if(!e.length)return{rows:[],reason:'目前没有 1–6 尾的四冷号。'};let cold=e[0].group,hot=new Set(a.hot.map(x=>x[0])),items=new Map(),add=(n,w,why)=>{let o=items.get(n)||{n,amount:0,why:new Set()};o.amount=Math.max(o.amount,w);o.why.add(why);items.set(n,o)};for(let n of cold){let dbl=related(n,a.recent)||a.series.some(s=>s.includes(n));add(n,dbl?2:1,dbl?'四冷号、双倍提示':'四冷号')}for(let n of cold)for(let h of adjacent(n))if(hot.has(h))add(h,items.get(n).amount,'与冷号相邻的热号');let rows=[...items.values()].sort((x,y)=>cold.includes(x.n)===cold.includes(y.n)?x.n-y.n:cold.includes(x.n)?-1:1).map(x=>({n:x.n,amount:x.amount,reason:[...x.why].join('、')})),total=rows.reduce((s,r)=>s+r.amount,0);for(let r of rows)if(total<20&&cold.includes(r.n)){r.amount++;total++}return{rows,total,reason:`选用 ${e[0].t} 尾四冷号；冷号优先，相关热号随后。`}}
function render(){if(!data.length){for(let id of['results','stats','tails','patterns','triples','bets','nr'])$(id).textContent='';$('results').classList.add('empty');localStorage.setItem('roulette_pc_pic_v1','[]');return}let a=analyze(data);$('results').classList.remove('empty');$('results').innerHTML=Array.from({length:Math.ceil(data.length/31)},(_,i)=>`<div class="line">${data.slice(i*31,i*31+31).map(fmt).join('　')}</div>`).join('');$('nr').textContent=a.nr;$('stats').innerHTML=`总游戏次数：${data.length}<br>热号（≥2次）：${a.hot.length?a.hot.map(([n,c])=>`<span class="chip">${fmt(n)}（${c}次）</span>`).join(''):'无'}`;$('tails').innerHTML=data.length<24?'<span class="empty">第 24 局后显示。</span>':a.tails.map(x=>x.missing.length===x.group.length?`<div class="notice">NO ${x.t} appears（${x.group.map(fmt).join('、')}）</div>`:x.missing.length===1?`<div>${x.t} ENDING WTT ${fmt(x.missing[0])}</div>`:'').filter(Boolean).join('')||'<span class="empty">暂无触发条件</span>';$('patterns').innerHTML=[...a.series.map(s=>`等差数列：${s.map(fmt).join('、')}`),...a.multiples].map(x=>`<div>${x}</div>`).join('')||'<span class="empty">暂无触发条件</span>';$('triples').innerHTML=a.triples.map(x=>`<div>三粘连 ${x.t.map(fmt).join('、')}：建议关注 ${fmt(x.missing[0])}（双倍提示）</div>`).join('')||'<span class="empty">暂无触发条件</span>';let b=allocate(a);$('bets').innerHTML=b.rows.length?`<p>${b.reason}</p><table><thead><tr><th>号码</th><th>金额</th><th>原因</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${fmt(r.n)}</td><td>$${r.amount}</td><td>${html(r.reason)}</td></tr>`).join('')}</tbody></table><p class="money">本次合计 $${b.total} / $20</p>`:`<span class="empty">${b.reason}</span>`;localStorage.setItem('roulette_pc_pic_v1',JSON.stringify(data))}
function add(){let v=$('entry').value.trim();if(!/^(?:[0-9]|[12][0-9]|3[0-7])$/.test(v)){setStatus('请输入 0 到 37 的整数。');return}if(data.length<40){data.push(+v);$('entry').value='';setStatus('');render()}}function setStatus(s){$('status').textContent=s}
function numbers(text){let out=[];for(let x of text.match(/00|\d{1,2}/g)||[]){let n=x==='00'?37:+x;if(n<=37)out.push(n)}return out}
function orderWords(words){let valid=words.map(w=>({w,n:numbers(w.text)[0],x:w.bbox.x0,y:w.bbox.y0,h:Math.max(1,w.bbox.y1-w.bbox.y0)})).filter(x=>x.n!==undefined);let rows=[];for(let item of valid.sort((a,b)=>a.y-b.y)){let row=rows.find(r=>Math.abs(r.y-item.y)<=Math.max(r.h,item.h)*.65);if(row){row.items.push(item);row.y=(row.y*(row.items.length-1)+item.y)/row.items.length;row.h=Math.max(row.h,item.h)}else rows.push({y:item.y,h:item.h,items:[item]})}return rows.sort((a,b)=>a.y-b.y).flatMap(r=>r.items.sort((a,b)=>b.x-a.x).map(x=>x.n))}
function showImage(url){imageUrl=url;$('preview').src=url;$('preview').style.display='block';$('camera').style.display='none';$('scan').disabled=false;$('ocrStatus').textContent='图片已准备好，点击“识别数字”。'}
async function makeOcrImage(url){let img=new Image;img.src=url;await img.decode();let scale=Math.min(4,Math.max(2,2200/Math.max(img.width,img.height))),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);let px=ctx.getImageData(0,0,c.width,c.height),d=px.data;for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2],light=.299*r+.587*g+.114*b;/* 白色数字及浅色数字保留，背景抹去 */let bright=light>142||(r>155&&g>100&&b>90&&light>125);let v=bright?0:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}ctx.putImageData(px,0,0);return c}
async function scan(){if(!imageUrl)return;let worker;try{$('scan').disabled=true;$('importOcr').disabled=true;$('ocrStatus').textContent='正在增强图片并载入数字识别…';if(!window.Tesseract)throw Error('无法加载识别组件。请检查网络连接后重试。');let enhanced=await makeOcrImage(imageUrl);worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent=`正在识别数字… ${Math.round((m.progress||0)*100)}%`}});await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'6'});let res=await worker.recognize(enhanced),vals=res.data.words?.length?orderWords(res.data.words):numbers(res.data.text);$('ocrText').value=vals.map(fmt).join(' ');$('importOcr').disabled=!vals.length;$('ocrStatus').textContent=vals.length?`识别到 ${vals.length} 个号码。已按右到左排序；请确认后导入。`:'未找到有效号码。请让号码区域更清晰、更靠近镜头后重试。'}catch(e){$('ocrStatus').textContent='识别失败：'+e.message}finally{await worker?.terminate();$('scan').disabled=false}}
$('choose').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(f)showImage(URL.createObjectURL(f))};$('openCamera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('camera').srcObject=stream;$('camera').style.display='block';$('preview').style.display='none';$('takePhoto').disabled=false;$('ocrStatus').textContent='摄像头已打开。对准号码后点击“拍照”。'}catch(e){$('ocrStatus').textContent='无法打开摄像头。请改用选择图片；摄像头通常需要 HTTPS 或本机服务器。'}};$('takePhoto').onclick=()=>{let v=$('camera'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);showImage(c.toDataURL('image/png'));stream?.getTracks().forEach(t=>t.stop());stream=null;$('takePhoto').disabled=true};$('scan').onclick=scan;$('clearOcr').onclick=()=>{imageUrl='';$('preview').removeAttribute('src');$('preview').style.display='none';$('ocrText').value='';$('scan').disabled=true;$('importOcr').disabled=true;$('ocrStatus').textContent='可识别 0–36、37 和 00；00 会保存为 37。'};$('importOcr').onclick=()=>{let vals=numbers($('ocrText').value);if(!vals.length){$('ocrStatus').textContent='没有可导入的有效号码。';return}data=vals.slice(0,40);render();setStatus(`已按右到左顺序导入 ${data.length} 局，作为初始数据。`);$('ocrStatus').textContent='导入完成。'};$('entry').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};$('add').onclick=add;$('undo').onclick=()=>{if(data.length){data.pop();setStatus('已撤销上一局。');render()}};$('reset').onclick=()=>$('resetDialog').showModal();$('resetNo').onclick=()=>$('resetDialog').close();$('resetYes').onclick=()=>{data=[];render();setStatus('');$('resetDialog').close()};render();
</script></body></html>
